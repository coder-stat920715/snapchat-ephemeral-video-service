services:
  postgres:
    image: postgres:16-alpine
    container_name: ephemeral-postgres
    environment:
      POSTGRES_DB: ephemeral
      POSTGRES_USER: ephemeral
      POSTGRES_PASSWORD: ephemeral
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ephemeral -d ephemeral"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ephemeral-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.4
    container_name: ephemeral-localstack
    environment:
      SERVICES: s3
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  pgdata:
  localstack-data:
